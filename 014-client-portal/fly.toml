# Fly.io 東京リージョン用の設定例（app 名は各自で変更）
# 手順は DEVELOPMENT.md「デプロイ」を参照。秘密情報は fly secrets set で設定する（このファイルに書かない）。
app = "client-portal-example"
primary_region = "nrt"

[build]

[env]
  NODE_ENV = "production"
  PORT = "8080"
  DATA_DIR = "/data"
  TRUST_PROXY = "true"
  ALLOW_SIGNUP = "false"
  STORAGE_DRIVER = "local"
  MAIL_DRIVER = "none"
  MAX_UPLOAD_MB = "500"

[[mounts]]
  source = "portal_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # SQLite + ローカルディスクのため 1 台で常時稼働（自動停止しない）
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
